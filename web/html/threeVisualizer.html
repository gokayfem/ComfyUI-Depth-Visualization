<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1"
        >
        <title>Depth Viewer</title>
        <link rel="stylesheet" href="../style/threeStyle.css">
        <script type="importmap">
            {
                "imports": {
                    "three": "../vendor/three.module.min.mjs"
                }
            }
        </script>
    </head>
    <body>
        <main id="viewer" aria-label="Interactive depth-map preview">
            <div id="canvas-container"></div>
            <div id="status" role="status" aria-live="polite">Waiting for output…</div>
            <div id="error" role="alert" hidden></div>

            <section class="toolbar" aria-label="Depth viewer controls">
                <label>
                    Frame
                    <select id="batch-select" disabled></select>
                </label>
                <label class="range-control">
                    Depth
                    <input
                        id="depth-scale"
                        type="range"
                        min="-5"
                        max="5"
                        step="0.05"
                        value="1.25"
                    >
                    <output id="depth-value">1.25</output>
                </label>
                <label>
                    Quality
                    <select id="mesh-quality">
                        <option value="96">Fast</option>
                        <option value="192" selected>Balanced</option>
                        <option value="320">High</option>
                    </select>
                </label>
                <label class="checkbox"><input id="wireframe" type="checkbox"> Wireframe</label>
                <button id="reset-camera" type="button">Reset view</button>
                <button id="screenshot" type="button">PNG</button>
                <label>
                    Mesh
                    <select id="export-format">
                        <option value="glb">GLB</option>
                        <option value="gltf">GLTF</option>
                        <option value="obj">OBJ</option>
                    </select>
                </label>
                <button id="export-mesh" type="button" disabled>Export</button>
            </section>
        </main>

        <script type="module" src="../js/threeVisualizer.mjs?v=3.0.0"></script>
    </body>
</html>
